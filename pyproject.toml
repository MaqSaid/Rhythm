[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rhythm-timesheet"
version = "0.1.0"
description = "Fraud-Proof Hybrid Timesheet System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "gradio==4.44.0",
    "gspread==6.1.0",
    "pynput==1.7.7",
    "pydantic==2.9.0",
    "google-generativeai==0.8.0",
    "oauth2client==4.1.3",
    "python-dateutil==2.9.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.112.0",
    "pytest==8.3.0",
    "pytest-mock==3.14.0",
    "pytest-asyncio==0.24.0",
    "freezegun==1.4.0",
    "responses==0.25.0",
    "playwright==1.47.0",
    "axe-playwright-python==0.1.4",
    "ruff==0.6.0",
    "mypy==1.11.0",
    "import-linter==2.0",
]
build = [
    "pyinstaller==6.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "architecture: Architecture constraint tests",
    "security: Security tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.importlinter]
root_packages = ["tracker", "portal", "shared"]

[[tool.importlinter.contracts]]
name = "Tracker does not import Portal"
type = "forbidden"
source_modules = ["tracker"]
forbidden_modules = ["portal"]

[[tool.importlinter.contracts]]
name = "Portal does not import Tracker"
type = "forbidden"
source_modules = ["portal"]
forbidden_modules = ["tracker"]

[[tool.importlinter.contracts]]
name = "Domain does not import adapters"
type = "forbidden"
source_modules = ["tracker.domain", "portal.domain"]
forbidden_modules = ["tracker.adapters", "portal.adapters"]
